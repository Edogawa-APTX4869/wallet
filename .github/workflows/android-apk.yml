name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android Version
        id: version
        run: |
          VERSION_NAME=$(grep -m1 'versionName' firefly-web/android/app/build.gradle | sed -E 's/.*"(.*)".*/\1/')
          VERSION_CODE=$(grep -m1 'versionCode' firefly-web/android/app/build.gradle | awk '{print $2}')
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: firefly-web/package-lock.json

      - name: Install dependencies & sync Capacitor Android
        working-directory: ./firefly-web
        run: |
          npm ci
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Decode Signing Keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "ANDROID_KEYSTORE_B64 secret is missing!" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "${{ runner.temp }}/wallet-release.keystore"

      - name: Build Signed Android APK
        working-directory: ./firefly-web/android
        env:
          WALLET_KEYSTORE_FILE: ${{ runner.temp }}/wallet-release.keystore
          WALLET_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WALLET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WALLET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../../Wallet-Android.apk
          cp app/build/outputs/apk/release/app-release.apk "../../Wallet-Android-v${{ steps.version.outputs.name }}.apk"
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort -V | tail -n1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs ../../Wallet-Android.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wallet-Android-APK
          path: |
            Wallet-Android.apk
            Wallet-Android-v${{ steps.version.outputs.name }}.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME="${{ steps.version.outputs.name }}"
          VERSION_CODE="${{ steps.version.outputs.code }}"
          VERSION_APK="Wallet-Android-v${VERSION_NAME}.apk"

          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk Wallet-Android.apk --clobber
          else
            gh release create latest-apk Wallet-Android.apk \
              --title "Wallet Android APK (Latest)" \
              --notes "Installable Android APK for Firefly Wallet (latest build)."
          fi

          if gh release view "v${VERSION_NAME}" >/dev/null 2>&1; then
            gh release upload "v${VERSION_NAME}" Wallet-Android.apk "$VERSION_APK" --clobber
          else
            gh release create "v${VERSION_NAME}" Wallet-Android.apk "$VERSION_APK" \
              --latest \
              --title "v${VERSION_NAME} (versionCode ${VERSION_CODE})" \
              --notes "Release v${VERSION_NAME} (versionCode ${VERSION_CODE}) built automatically from commit ${{ github.sha }}."
          fi
