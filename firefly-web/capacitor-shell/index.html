<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Wallet</title>
  <style>
    :root {
      --bg: #f8f9fc;
      --surface: #ffffff;
      --surface-2: #f1f3f9;
      --fg: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #4f46e5;
      --primary-fg: #ffffff;
      --success: #10b981;
      --danger: #ef4444;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161821;
        --surface: #1e212d;
        --surface-2: #262a38;
        --fg: #f3f4f6;
        --muted: #9ca3af;
        --border: #2e3344;
        --primary: #6366f1;
        --primary-fg: #ffffff;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--fg);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(1.5rem + env(safe-area-inset-top)) 1.25rem calc(1.5rem + env(safe-area-inset-bottom));
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.12);
      display: flex;
      flex-direction: column;
      gap: 1.125rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--primary);
      color: var(--primary-fg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.25rem;
      flex-shrink: 0;
    }
    .brand-text h1 {
      font-size: 1.125rem;
      font-weight: 700;
      line-height: 1.2;
    }
    .brand-text p {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      padding: 0.75rem;
      border-radius: 12px;
      background: var(--surface-2);
      font-size: 0.8125rem;
      color: var(--fg);
    }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .field {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
    }
    .field label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
    }
    .input {
      height: 44px;
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      padding: 0 0.875rem;
      font-size: 0.875rem;
      outline: none;
    }
    .input:focus {
      border-color: var(--primary);
    }
    .presets {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
    }
    .preset-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 42px;
      padding: 0.5rem 0.75rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--fg);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
    }
    .preset-btn:active { transform: scale(0.99); }
    .preset-tag {
      font-size: 0.6875rem;
      padding: 2px 6px;
      border-radius: 6px;
      background: var(--surface);
      color: var(--muted);
    }
    .btn {
      height: 48px;
      width: 100%;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: var(--primary-fg);
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .btn:active { opacity: 0.92; transform: scale(0.99); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="logo">W</div>
      <div class="brand-text">
        <h1>Wallet</h1>
        <p>Personal Finance &amp; Net Worth</p>
      </div>
    </div>

    <div id="status-box" class="status">
      <div id="spinner" class="spinner hidden"></div>
      <span id="status-text">Enter your public HTTPS Firefly Wallet URL to connect</span>
    </div>

    <form id="server-form" class="field">
      <label for="server-url">Server Address</label>
      <input
        id="server-url"
        class="input"
        type="url"
        placeholder="https://firefly.example.com"
        required
      />
    </form>

    <button id="connect-btn" type="button" class="btn">
      Launch Wallet
    </button>
  </div>

  <script>
    (function () {
      var input = document.getElementById("server-url");
      var statusText = document.getElementById("status-text");
      var spinner = document.getElementById("spinner");
      var connectBtn = document.getElementById("connect-btn");
      var form = document.getElementById("server-form");

      function isDisallowedHost(host) {
        var h = (host || "").trim().replace(/^\[|\]$/g, "").replace(/\.+$/, "").toLowerCase();
        if (!h || h === "localhost" || h.indexOf("localhost.") === 0) return true;
        var suffixes = [".localhost", ".local", ".internal", ".lan", ".home", ".home.arpa", ".localdomain", ".ts.net"];
        for (var i = 0; i < suffixes.length; i++) {
          if (h.slice(-suffixes[i].length) === suffixes[i]) return true;
        }
        if (/^\d{1,3}(\.\d{1,3}){3}$/.test(h) || h.indexOf(":") !== -1) return true;
        var parts = h.split(".");
        if (parts.length < 2) return true;
        return !/^[a-z]{2,}$/i.test(parts[parts.length - 1]);
      }

      function validateUrl(raw) {
        var trimmed = (raw || "").trim().replace(/\/+$/, "");
        if (!trimmed) throw new Error("Enter a valid public HTTPS domain (e.g. https://firefly.example.com).");
        if (!/^[a-z][a-z0-9+.-]*:/i.test(trimmed)) {
          trimmed = "https://" + trimmed;
        }
        var parsed = new URL(trimmed);
        if (parsed.protocol !== "https:" || parsed.username || parsed.password || isDisallowedHost(parsed.hostname)) {
          throw new Error("Only public HTTPS domains are permitted. Internal hosts and plain HTTP links are blocked.");
        }
        return parsed.protocol + "//" + parsed.host + (parsed.pathname === "/" ? "" : parsed.pathname.replace(/\/+$/, ""));
      }

      function launch(targetUrl) {
        try {
          var url = validateUrl(targetUrl);
          input.value = url;
          spinner.classList.remove("hidden");
          statusText.textContent = "Opening " + url + " ...";
          window.location.replace(url);
        } catch (err) {
          spinner.classList.add("hidden");
          statusText.textContent = err && err.message ? err.message : "Enter a valid public HTTPS domain.";
        }
      }

      connectBtn.addEventListener("click", function () {
        launch(input.value);
      });

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        launch(input.value);
      });
    })();
  </script>
</body>
</html>
